name: P5 R2 pre-production release gate

on:
  workflow_dispatch:
  push:
    branches: [candidate, main]
  pull_request:
    branches: [candidate, main]

permissions:
  contents: read

jobs:
  p5-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Pin source timestamp before any build
        shell: bash
        run: |
          set -euo pipefail
          echo "GHRAB_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          node scripts/ci-timing.mjs start npm-ci
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node scripts/ci-timing.mjs stop npm-ci
      - name: P2 browser cache contract negative regressions
        run: npm run test:p2:browser-cache
      - name: Verify bounded CDP page target readiness regressions
        run: npm run test:ci-cdp-target
      - name: Verify pinned audit tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      # Exact-version, exact-lockfile cache; no fallback/restore keys.
      # Browser content is attested before use; cache never skips OS deps.
      - name: Restore pinned Playwright browser cache (experimental)
        id: p2-browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: activa-p2-ubuntu24-x64-pw1.61.1-${{ hashFiles('package-lock.json') }}-v1
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          node scripts/ci-timing.mjs start playwright
          npx --no-install playwright install --with-deps --no-shell chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
          node scripts/ci-timing.mjs stop playwright
      - name: Verify pinned browser cache and Chromium smoke before any QA
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.p2-browser-cache.outputs.cache-hit }}
        run: node scripts/ci-playwright-cache.mjs verify
      - name: Verify P0 reproducibility and race-guard regressions
        run: |
          npm run test:build-determinism
          npm run test:ci-canonical
          npm run test:deploy-source
          npm run test:ci-timing
          npm run test:p5:parallel
          npm run test:ci-release-admission
          npm run test:ci-garp25-isolation
      - name: Run P5 R2 + cumulative GARP 2.7 CI gate
        run: |
          node scripts/ci-timing.mjs start p5
          npm run qa:p5:ci
          node scripts/ci-timing.mjs stop p5
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 40452c944f2d3be1ab10bbe717218ad94f1141400ff68690dcfe6a753f89676e
      - name: Preserve canonical tested dist digest for later release build
        run: node scripts/ci-canonical.mjs capture
      - name: Build school-server SHIELD-PREP profile for full GARP gate
        if: github.event_name != 'pull_request' || github.base_ref == 'candidate'
        run: npm run build:school-server
      - name: Run full GARP 2.7 foundation gate
        if: github.event_name != 'pull_request' || github.base_ref == 'candidate'
        run: |
          node scripts/ci-timing.mjs start foundation
          npm run qa:garp27:foundation
          node scripts/ci-timing.mjs stop foundation
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 40452c944f2d3be1ab10bbe717218ad94f1141400ff68690dcfe6a753f89676e
      - name: Diagnose GARP foundation failure (sanitized)
        if: failure()
        run: node scripts/ci-garp-diagnostic.mjs
      - name: Build and verify PREP exact release identity
        if: github.event_name != 'pull_request' || github.base_ref == 'candidate'
        env:
          GHRAB_SOURCE_REPOSITORY: ${{ github.repository }}
          GHRAB_SOURCE_COMMIT: ${{ github.sha }}
          GHRAB_BUILD_ID: p5-${{ github.run_id }}-${{ github.run_attempt }}
          GHRAB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GHRAB_RELEASE_STAGE: PREP-VALIDATION
        run: |
          node scripts/ci-timing.mjs start prep-release
          npm run build:pages
          node scripts/ci-canonical.mjs verify
          npm run prepare:pages
          npm run verify:release-chain
          npm run qa:auto-patch-topology
          node scripts/ci-timing.mjs stop prep-release
      - name: Verify preserved P5 certification evidence
        run: node scripts/ci-evidence.mjs verify p5
      - name: Verify PREP evidence and exact-SHA binding
        if: github.event_name != 'pull_request' || github.base_ref == 'candidate'
        run: node scripts/ci-evidence.mjs verify-stage PREP-VALIDATION
      - name: Publish CI timing evidence (including interrupted phases)
        if: always()
        run: node scripts/ci-timing.mjs report p5
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p5-r2-${{ github.sha }}
          path: |
            qa-results/p5-snapshot/**
            qa-results/ci-canonical.json
            qa-results/current/**
            qa-results/ci-timing-p5.json
            qa-results/p5-p1-orchestration.json
            qa-results/ci-playwright-browser.json
            dist-pages/release-integrity.json
            dist-pages/studio-manifest.json
            dist-pages/sbom.cdx.json
            dist-pages/build-provenance.json
            dist-pages/security-evidence-manifest.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload GARP foundation logs (PREP only)
        if: always() && (github.event_name != 'pull_request' || github.base_ref == 'candidate')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: garp27-foundation-${{ github.sha }}
          path: audit/evidence/garp27-current/**
          include-hidden-files: true
          if-no-files-found: error

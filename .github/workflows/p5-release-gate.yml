name: P5 R2 pre-production release gate

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  p5-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify pinned audit tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run P5 R2 release gate
        run: npm run qa:p5:ci
      - name: Set deterministic build time
        shell: bash
        run: echo "GHRAB_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - name: Build school-server SHIELD-PREP profile
        run: npm run build:school-server
      - name: Run GARP 2.5.1 SHIELD static gates
        run: npm run garp25:prep-static
      - name: Build hygienic GitHub Pages artifact
        run: npm run build:pages
      - name: Scan GitHub Pages artifact for leaks
        run: npm run garp25:leaks:pages
      - name: Exercise GitHub Pages hygiene negative control
        run: npm run garp25:pages:selftest
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p5-r2-${{ github.sha }}
          path: |
            dist/qa-p5-*.json
            dist/qa-p3-browser-report.json
            dist/quality-report.json

name: ACTIVA Verify and Deploy

on:
  workflow_run:
    workflows: ["P5 R2 pre-production release gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activa-production-pages
  cancel-in-progress: false

jobs:
  release-build:
    permissions:
      contents: read
      actions: read
      checks: read
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      app_version: ${{ steps.release-identity.outputs.app_version }}
      artifact_digest: ${{ steps.release-identity.outputs.artifact_digest }}
      manifest_sha256: ${{ steps.release-identity.outputs.manifest_sha256 }}
      sbom_sha256: ${{ steps.release-identity.outputs.sbom_sha256 }}
      evidence_manifest_sha256: ${{ steps.release-identity.outputs.evidence_manifest_sha256 }}
      build_provenance_sha256: ${{ steps.release-identity.outputs.build_provenance_sha256 }}
      assurance_mode: ${{ steps.release-identity.outputs.assurance_mode }}
      release_stage: ${{ steps.release-identity.outputs.release_stage }}
      garp_profile: ${{ steps.release-identity.outputs.garp_profile }}
      gate: ${{ steps.release-identity.outputs.gate }}
      source_sha: ${{ steps.release-source.outputs.source_sha }}
    steps:
      - name: Resolve verified source SHA
        id: release-source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then source_sha="${{ github.event.workflow_run.head_sha }}"; else source_sha="${{ github.sha }}"; fi
          if ! [[ "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then echo "::error::Invalid release source SHA."; exit 1; fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout verified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.release-source.outputs.source_sha }}
          persist-credentials: false
      - name: Bind all audit commands to the checked-out release SHA
        shell: bash
        run: echo "GHRAB_SOURCE_COMMIT=${{ steps.release-source.outputs.source_sha }}" >> "$GITHUB_ENV"
      - name: Pin deterministic build time before any release QA
        shell: bash
        run: |
          set -euo pipefail
          echo "GHRAB_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Verify source is still latest main before build
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          node scripts/verify-deploy-source.mjs "${{ steps.release-source.outputs.source_sha }}" "$head_sha"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify release admission regressions before releasing
        run: npm run test:ci-release-admission
      - name: Require independent exact-SHA P5/axe main certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release-admission.mjs check
      - name: Install locked dependencies
        run: |
          node scripts/ci-timing.mjs start npm-ci
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node scripts/ci-timing.mjs stop npm-ci
      - name: P2 browser cache contract negative regressions
        run: npm run test:p2:browser-cache
      - name: Verify bounded CDP page target readiness regressions
        run: npm run test:ci-cdp-target
      - name: Verify pinned Playwright version
        run: node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      # Exact-version, exact-lockfile cache; no fallback/restore keys.
      # Browser content is attested before use; cache never skips OS deps.
      - name: Restore pinned Playwright browser cache (experimental)
        id: p2-browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: activa-p2-ubuntu24-x64-pw1.61.1-${{ hashFiles('package-lock.json') }}-v1
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          node scripts/ci-timing.mjs start playwright
          npx --no-install playwright install --with-deps --no-shell chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
          node scripts/ci-timing.mjs stop playwright
      - name: Verify pinned browser cache and Chromium smoke before any QA
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.p2-browser-cache.outputs.cache-hit }}
        run: node scripts/ci-playwright-cache.mjs verify
      - name: Preserve pinned Chromium provenance outside QA workspace
        shell: bash
        run: cp qa-results/ci-playwright-browser.json "$RUNNER_TEMP/activa-playwright-provenance.json"
      - name: Run unified error reporter regression
        run: npm run test:reporter
      - name: Run document import regression
        run: node scripts/doc-import-test.mjs
      - name: Verify P1 fail-closed P5 orchestration regression
        run: npm run test:p5:parallel
      - name: Run release QA
        run: |
          node scripts/ci-timing.mjs start release-qa
          npm run qa:release
          node scripts/ci-timing.mjs stop release-qa
      - name: Restore pinned Chromium provenance after QA workspace reset
        shell: bash
        run: cp "$RUNNER_TEMP/activa-playwright-provenance.json" qa-results/ci-playwright-browser.json
      - name: Refresh exact-SHA release admission after QA workspace reset
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release-admission.mjs check
      - name: Preserve release QA evidence before later builds
        run: node scripts/ci-evidence.mjs capture release
      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform
      - name: Enforce P5 R2 + cumulative GARP 2.7 release gate
        run: |
          node scripts/ci-timing.mjs start p5
          npm run qa:p5:ci
          node scripts/ci-timing.mjs stop p5
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 40452c944f2d3be1ab10bbe717218ad94f1141400ff68690dcfe6a753f89676e
      - name: Preserve canonical tested dist digest
        run: node scripts/ci-canonical.mjs capture
      - name: Build school-server SHIELD-PREP profile
        run: npm run build:school-server
      - name: Enforce cumulative GARP 2.7 foundation and legacy regressions
        run: |
          node scripts/ci-timing.mjs start foundation
          npm run qa:garp27:foundation
          node scripts/ci-timing.mjs stop foundation
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 40452c944f2d3be1ab10bbe717218ad94f1141400ff68690dcfe6a753f89676e
      - name: Diagnose GARP foundation failure (sanitized)
        if: failure()
        run: node scripts/ci-garp-diagnostic.mjs
      - name: Verify AI Studio dispatch credential
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AI_STUDIO_DISPATCH_TOKEN:-}" ]; then echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Deployment is blocked because AI Studio could not be notified safely."; exit 1; fi
      - name: Build hygienic GitHub Pages artifact
        run: |
          node scripts/ci-timing.mjs start pages-build
          npm run build:pages
          node scripts/ci-canonical.mjs verify
          node scripts/ci-timing.mjs stop pages-build
      - name: Prepare canonical Pages artifact and exact release identity
        run: |
          node scripts/ci-timing.mjs start release-identity
          npm run prepare:pages
          node scripts/ci-timing.mjs stop release-identity
        env:
          GHRAB_SOURCE_REPOSITORY: ${{ github.repository }}
          GHRAB_SOURCE_COMMIT: ${{ steps.release-source.outputs.source_sha }}
          GHRAB_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          GHRAB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GHRAB_RELEASE_STAGE: LIVE-PUBLIC-PAGES
      - name: Verify complete release chain
        run: npm run verify:release-chain
      - name: Verify P5, GARP, QA and exact-SHA evidence in LIVE release
        run: node scripts/ci-evidence.mjs verify-stage LIVE-PUBLIC-PAGES
      - name: Reverify live admission receipt after P5/GARP/QA
        run: node scripts/ci-release-admission.mjs verify
      - name: Finalize measured CI phase durations
        if: always()
        run: node scripts/ci-timing.mjs report release
      - name: Upload complete LIVE release assurance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-assurance-${{ steps.release-source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa-results/p5-snapshot/**
            qa-results/ci-canonical.json
            qa-results/release-snapshot/**
            qa-results/current/**
            qa-results/ci-timing-release.json
            qa-results/ci-release-admission.json
            qa-results/p5-p1-orchestration.json
            qa-results/ci-playwright-browser.json
            audit/evidence/garp27-current/**
            dist-pages/release-integrity.json
            dist-pages/studio-manifest.json
            dist-pages/sbom.cdx.json
            dist-pages/build-provenance.json
            dist-pages/security-evidence-manifest.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Export verified release identity
        id: release-identity
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const integrity = JSON.parse(fs.readFileSync('dist-pages/release-integrity.json', 'utf8'));
          const required = { app_version: integrity.version, artifact_digest: integrity.artifactDigest, manifest_sha256: integrity.manifestSha256, sbom_sha256: integrity.sbomSha256, evidence_manifest_sha256: integrity.evidenceManifestSha256, build_provenance_sha256: integrity.buildProvenanceSha256, assurance_mode: integrity.assuranceMode, release_stage: integrity.releaseStage, garp_profile: integrity.garpProfile, gate: integrity.gate };
          if (integrity.releaseStage !== 'LIVE-PUBLIC-PAGES') { console.error(`::error::Release record is not a live Pages release (${integrity.releaseStage}).`); process.exit(1); }
          const missing = Object.entries(required).filter(([, value]) => !value).map(([key]) => key);
          if (missing.length) { console.error(`::error::Release identity incomplete: ${missing.join(', ')}`); process.exit(1); }
          for (const [key, value] of Object.entries(required)) { if (/[\r\n]/.test(String(value))) { console.error('::error::Release identity output must be single-line.'); process.exit(1); } process.stdout.write(`${key}=${value}\n`); }
          NODE
      - name: Verify latest main before constructing Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          node scripts/verify-deploy-source.mjs "${{ steps.release-source.outputs.source_sha }}" "$head_sha"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist-pages
          include-hidden-files: true

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: release-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    steps:
      - name: Reject superseded main release before Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote --exit-code "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)"
          if [ "$main_sha" != "${{ needs.release-build.outputs.source_sha }}" ]; then
            echo "::error::Superseded SHA: certified source differs from current main."
            exit 1
          fi
      - name: Deploy to GitHub Pages (attempt 1/3)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Wait before Pages retry 2
        if: steps.deployment_1.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (attempt 2/3)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Wait before Pages retry 3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        run: sleep 180
      - name: Deploy to GitHub Pages (attempt 3/3)
        id: deployment_3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Enforce successful Pages deployment
        if: steps.deployment_1.outcome != 'success' && steps.deployment_2.outcome != 'success' && steps.deployment_3.outcome != 'success'
        run: |
          echo "::error::GitHub Pages deployment failed after 3 bounded attempts."
          exit 1

  notify-ai-studio:
    needs: [release-build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release-build.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Verify the live release before notifying AI Studio
        env:
          GHRAB_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
          GHRAB_LIVE_APP_ID: activity-builder
          GHRAB_LIVE_VERSION: ${{ needs.release-build.outputs.app_version }}
          GHRAB_LIVE_SOURCE_SHA: ${{ needs.release-build.outputs.source_sha }}
          GHRAB_LIVE_ARTIFACT_DIGEST: ${{ needs.release-build.outputs.artifact_digest }}
          GHRAB_LIVE_MANIFEST_SHA256: ${{ needs.release-build.outputs.manifest_sha256 }}
          GHRAB_LIVE_OUT: ${{ runner.temp }}/live-release.json
        run: npm run verify:live-release
      - name: Reject superseded release before notifying AI Studio
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          node scripts/verify-deploy-source.mjs "${{ needs.release-build.outputs.source_sha }}" "$main_sha"
      - name: Dispatch app-updated event to AI Studio
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.release-build.outputs.source_sha }}
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
          APP_VERSION: ${{ needs.release-build.outputs.app_version }}
          ARTIFACT_DIGEST: ${{ needs.release-build.outputs.artifact_digest }}
          MANIFEST_SHA256: ${{ needs.release-build.outputs.manifest_sha256 }}
          SBOM_SHA256: ${{ needs.release-build.outputs.sbom_sha256 }}
          EVIDENCE_MANIFEST_SHA256: ${{ needs.release-build.outputs.evidence_manifest_sha256 }}
          BUILD_PROVENANCE_SHA256: ${{ needs.release-build.outputs.build_provenance_sha256 }}
          ASSURANCE_MODE: ${{ needs.release-build.outputs.assurance_mode }}
          RELEASE_STAGE: ${{ needs.release-build.outputs.release_stage }}
          GARP_PROFILE: ${{ needs.release-build.outputs.garp_profile }}
          RELEASE_GATE: ${{ needs.release-build.outputs.gate }}
          LIVE_RELEASE_FILE: ${{ runner.temp }}/live-release.json
        run: |
          set -euo pipefail
          if [ -z "${AI_STUDIO_DISPATCH_TOKEN:-}" ]; then echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Dispatch is fail-closed."; exit 1; fi
          node scripts/build-ai-studio-dispatch.mjs "$LIVE_RELEASE_FILE" "$RUNNER_TEMP/ai-studio-dispatch.json"
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AI_STUDIO_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Daniel22-dev/AI-Studio-GHRAB/dispatches \
            --data-binary "@$RUNNER_TEMP/ai-studio-dispatch.json"
          echo "AI Studio dispatch accepted for $SOURCE_REPOSITORY@$SOURCE_SHA version $APP_VERSION"
